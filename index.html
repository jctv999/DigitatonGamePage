<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitatonGame | Passive Amnesia: UAO Edition</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-header">
        <h1>Passive Amnesia</h1>
        <p>UAO Edition &middot; Recover your memories, one passive sentence at a time</p>
      </div>
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-loading-title">Loading...</div>
            <div id="unity-loading-tip"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-controls">
          <b>Move:</b> WASD / arrows &nbsp; <b>Interact:</b> E &nbsp; <b>Notebook:</b> C &nbsp; <b>Pause:</b> Esc
        </div>
        <div id="unity-fullscreen-button" title="Fullscreen"></div>
        <div id="unity-credits">Universidad Aut&oacute;noma de Occidente &middot; SDG 8 and SDG 12 &middot; English: the passive voice</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");

      // Aviso temporal (o error permanente) sobre el juego
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b3261e; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #f58a1f; color: #170d0a; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Consejos de gramática mientras carga
      var tips = [
        "Passive = be + past participle.",
        "The receiver of the action goes first.",
        "Use 'by' to name the doer.",
        "The workers were paid by the company.",
        "Present perfect passive: have / has been + participle.",
        "After a modal, use be: must be worn."
      ];
      var tipBox = document.querySelector("#unity-loading-tip");
      var tipIndex = Math.floor(Math.random() * tips.length);
      tipBox.textContent = tips[tipIndex];
      var tipTimer = setInterval(function() {
        tipIndex = (tipIndex + 1) % tips.length;
        tipBox.textContent = tips[tipIndex];
      }, 2800);

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/DigitatonGame.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/DigitatonGame.data.unityweb",
        frameworkUrl: buildUrl + "/DigitatonGame.framework.js.unityweb",
        codeUrl: buildUrl + "/DigitatonGame.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "DefaultCompany",
        productName: "DigitatonGame",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const loadingTitle = document.querySelector("#unity-loading-title");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
            loadingTitle.textContent = "Loading... " + Math.round(100 * progress) + "%";
          } else {
            loadingContainer.style.display = "none";
            clearInterval(tipTimer);
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
    </script>
  </body>
</html>
